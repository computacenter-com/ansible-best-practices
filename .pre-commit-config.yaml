repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: 📝 Remove trailing whitespaces
        args: [--markdown-linebreak-ext=md]
      - id: requirements-txt-fixer
        name: 🐍 Sort entries in requirements.txt
      - id: check-merge-conflict
        name: ❌ Check for merge conflict markers
      - id: check-yaml
        name: 🐫 Check YAML syntax
        args: [--unsafe]
      - id: no-commit-to-branch
        name: 💻 Check for commits to allowed branch
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: 📋 Check Markdown syntax
  - repo: https://github.com/ansible-community/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        language_version: python3
        name: 🔎 Check documentation examples with ansible-lint
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
        name: ➿ Check GitHub Workflows
      - id: check-github-issue-forms
        name: 📚 Check GitHub Issue Forms
      - id: check-renovate
        name: 🔤 Check Renovate configuration
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.1
    hooks:
      - id: typos
        name: ❓ Check for typos
        args: ['--config', '.typos.toml', '--force-exclude']
  - repo: https://github.com/AlexanderDokuchaev/md-dead-link-check
    rev: "v1.3.0"
    hooks:
      - id: md-dead-link-check
        name: 🔭 Check internal and external links
        args: ['--config', '.config/md_dead_link_check.ini']
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: 🔓 Check for hardcoded secrets
