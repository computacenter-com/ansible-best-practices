---
name: 📝 Documentation Request
description: Request a new or an updated input to the documentation.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for taking the time to open this Issue!**

        💡 **Please note**
        This Issue type is meant for requesting a new or an updated input for the Best Practice Guide.
        For a missing feature to the Zensical deployment itself, please use the [Feature request](https://github.com/computacenter-com/ansible-best-practices/issues/new?assignees=&labels=feature&template=feature_request.yml) issue type.

  - type: input
    id: contact
    attributes:
        label: ☎️ Contact Details
        description: How can we get in touch with you if we need more info?
        placeholder: ex. email@example.com
    validations:
        required: false

  - type: dropdown
    id: section
    attributes:
      label: Which section?
      description: Which section of the Guide needs an update?
      options:
        - Overview
        - Mindset
        - Get started
        - Ansible
        - Ansible Automation Platform
        - Ansible Development
        - Ecosystem
    validations:
      required: true

  - type: dropdown
    id: sub-section
    attributes:
      label: Which sub-section?
      description: Which sub-section of the Guide needs an update, if applicable?
      options:
        - Mindeset > The Zen of Ansible
        - Get started > Checklist
        - Ansible > Installation
        - Ansible > Project structure
        - Ansible > Inventory
        - Ansible > Playbook
        - Ansible > Collections
        - Ansible > Roles
        - Ansible > Tasks
        - Ansible > Variables
        - Ansible > Execution
        - Ansible Automation Platform > Installation
        - Ansible Automation Platform > Operations
        - Ansible Automation Platform > > Troubleshooting
        - Ansible Automation Platform > Job Templates
        - Ansible Automation Platform > Credentials
        - Ansible Automation Platform > Workflows
        - Ansible Development > Version Control
        - Ansible Development > Linting
        - Ansible Development > Testing
        - Ansible Development > Monitoring & Troubleshooting
        - Ansible Development > Logging
        - Ansible Development > Extending
        - Ansible Development > Execution Environments
        - Ecosystem > Event-driven Ansible
        - Ecosystem > Ansible Sign
    validations:
      required: false

  - type: textarea
    id: whats-missing
    attributes:
      label: What is missing?
      description: What needs to be documented better or even documented at all?
      value: "Please give a clear and concise explanation what needs to be updated or documented!"
    validations:
      required: true